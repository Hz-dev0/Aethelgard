name: bump-sw-version

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sw.js'
      - 'index.html'
      - '.github/**'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bump sw.js / index.html build number
        run: node scripts/bump-sw-version.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git diff --cached --quiet || (git commit -m "chore: bump sw version [skip ci]" && git push)
