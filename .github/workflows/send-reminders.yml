name: send-reminders

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分鐘（GitHub 排程偶爾會延遲幾分鐘）
  workflow_dispatch:         # 也可以在 Actions 頁面手動按「Run workflow」測試

concurrency:
  group: send-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-admin
        run: npm install --no-save --no-package-lock firebase-admin@12
      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-reminders.js
