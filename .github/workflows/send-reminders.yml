name: send-reminders

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分鐘（GitHub 排程常會延遲幾分鐘，屬正常）
  workflow_dispatch:         # 也可以在 Actions 頁面手動按 Run workflow 測試

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin
      - run: node js/send-reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
